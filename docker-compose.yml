# El servicio M2 y su base de datos (RNF-04.1, RNF-04.3, RNF-04.4). Desde un clon limpio, sin crear ni editar archivos:
#   docker compose up -d --build --wait
# La configuración sale de ejemplo.env; una variable definida en el entorno manda sobre el ejemplo (RNF-06.3).
services:
  m2:
    build: .
    image: m2-clientes:0.1.0
    env_file: ejemplo.env
    # Reenvía las señales y recoge procesos huérfanos, para que la parada llegue a Node (RNF-04.5).
    init: true
    ports:
      - "${M2_PUERTO:-8082}:${M2_PUERTO:-8082}"
    depends_on:
      bd:
        condition: service_healthy
    # Un GET con Node: la imagen no trae curl, y `wget --spider` manda HEAD, que da 405. El puerto lo lee del entorno del contenedor.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.M2_PUERTO + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      # Da tiempo a las migraciones del primer arranque.
      start_period: 30s

  bd:
    image: postgres:18.6
    env_file: ejemplo.env
    volumes:
      # La imagen 18 guarda los datos en /var/lib/postgresql/18/docker (ADR del stack): el volumen va un nivel más arriba.
      - datos-bd:/var/lib/postgresql
    # Por TCP: mientras inicializa, la imagen levanta un servidor temporal que solo escucha por socket, y un chequeo por
    # socket la daría por sana antes de tiempo. Con $$, para que las variables las lea el contenedor y no compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  datos-bd:
