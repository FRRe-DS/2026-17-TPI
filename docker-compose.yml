# El servicio M2 y su base de datos (RNF-04.1, RNF-04.3, RNF-04.4). Desde un clon limpio, sin crear ni editar archivos:
#   docker compose up -d --build --wait
# Con el perfil `panel` suma el panel, el M6 simulado (spec 071) y el puente a la base (spec 072); sin él, no se crean:
#   docker compose --profile panel up -d --build --wait
# La configuración sale de ejemplo.env; una variable definida en el entorno manda sobre el ejemplo (RNF-06.3).
services:
  m2:
    build: .
    image: m2-clientes:0.1.0
    env_file: ejemplo.env
    # Reenvía las señales y recoge procesos huérfanos, para que la parada llegue a Node (RNF-04.5).
    init: true
    ports:
      - "${M2_PUERTO:-8082}:${M2_PUERTO:-8082}"
    depends_on:
      bd:
        condition: service_healthy
    # Un GET con Node: la imagen no trae curl, y `wget --spider` manda HEAD, que da 405. El puerto lo lee del entorno del contenedor.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.M2_PUERTO + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      # Da tiempo a las migraciones del primer arranque.
      start_period: 30s

  bd:
    image: postgres:18.6
    env_file: ejemplo.env
    volumes:
      # La imagen 18 guarda los datos en /var/lib/postgresql/18/docker (ADR del stack): el volumen va un nivel más arriba.
      - datos-bd:/var/lib/postgresql
    # Por TCP: mientras inicializa, la imagen levanta un servidor temporal que solo escucha por socket, y un chequeo por
    # socket la daría por sana antes de tiempo. Con $$, para que las variables las lea el contenedor y no compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 20

  # El panel y el M6 simulado (spec 071, RNF-04.6). Solo con `--profile panel`. Los dos publican su puerto únicamente en
  # 127.0.0.1: el panel firma tokens de desarrollo y el canal de control cambia el comportamiento del M6; ninguno es para exponerlo.
  # Leen ejemplo.env como los demás; lo que cambia dentro del contenedor (dónde escuchan y cómo se llaman entre sí) va en `environment`.
  m6:
    profiles: [panel]
    build:
      context: .
      dockerfile: panel/Dockerfile
      target: m6-simulado
    image: m2-m6-simulado:0.1.0
    env_file: ejemplo.env
    init: true
    # Solo el canal de control. La API de M6 (M6_PUERTO) la ve M2 por la red de compose como m6:3006, sin publicarla.
    ports:
      - "127.0.0.1:${M6_PUERTO_CONTROL:-3007}:${M6_PUERTO_CONTROL:-3007}"
    # El canal sigue sano en el modo caído, que cierra la API: se mira el canal y no la API.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.M6_PUERTO_CONTROL + '/control/estado').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  panel:
    profiles: [panel]
    build:
      context: .
      dockerfile: panel/Dockerfile
      target: panel
    image: m2-panel:0.1.0
    env_file: ejemplo.env
    init: true
    environment:
      PANEL_ESCUCHA: 0.0.0.0
      # Dentro del contenedor el panel llega a la base por la red de compose, sin pasar por el puente. Compose interpola estas
      # variables de su propio entorno, no de ejemplo.env: los valores por defecto se repiten acá y se cambian juntos.
      PANEL_URL_BD: postgres://${POSTGRES_USER:-m2}:${POSTGRES_PASSWORD:-m2-contrasena-de-desarrollo}@bd:5432/${POSTGRES_DB:-m2}
      # Sin Docker dentro del contenedor: apagar y encender la base solo funcionan con el panel en la máquina (npm run panel).
      PANEL_DOCKER: "no"
      PANEL_URL_M2: http://m2:${M2_PUERTO:-8082}
      PANEL_URL_M2_PUBLICA: ${PANEL_URL_M2_PUBLICA:-http://localhost:${M2_PUERTO:-8082}}
      PANEL_URL_M6_CONTROL: http://m6:${M6_PUERTO_CONTROL:-3007}
    ports:
      - "127.0.0.1:${PANEL_PUERTO:-8083}:${PANEL_PUERTO:-8083}"
    depends_on:
      m2:
        condition: service_healthy
      m6:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PANEL_PUERTO + '/salud-panel').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  # El puente a la base (spec 072, RNF-04.8): solo con `--profile panel`. Publica la base en 127.0.0.1 para que el panel, cuando corre
  # en la máquina (`npm run panel`), cuente filas y pruebe la restricción del puntaje. Sin el perfil no se publica ningún puerto de
  # la base. La contraseña es la de desarrollo de ejemplo.env: el riesgo es el de M2, que ya está publicado, acotado a la máquina.
  bd-puente:
    profiles: [panel]
    build:
      context: .
      dockerfile: panel/Dockerfile
      target: puente-bd
    image: m2-puente-bd:0.1.0
    init: true
    ports:
      - "127.0.0.1:${PANEL_PUERTO_BD:-5433}:5433"
    depends_on:
      bd:
        condition: service_healthy
    # Abre una conexión a su propio puerto, que el puente une con la base y se cierra enseguida (PostgreSQL deja una línea de
    # «incomplete startup packet» en su log por cada chequeo: es el precio de comprobar el camino entero).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(5433, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  datos-bd:
