openapi: 3.1.0
info:
  title: Dependencia M6 consumida por M2 — extracción del contrato de la cátedra
  version: 1.0.0
  description: |
    Alcance: RF-2.4, RF-2.5 y RNF-05. Solo las dos consultas que M2 consume y los componentes que referencian, sin cambios.
    Fuente: contrato de M6 del Grupo 12 subido a la cátedra en FRRe-DS/2026-TPI#9, archivo contratos/m6_viajes/openapi.yml,
    commit 9e720a0d074ef8e9cc20ba189baf340b071779f3 (2026-10-25). Es el contrato que va a usar el consorcio, aunque el PR
    todavía no está mergeado. Decisión y diferencias con el borrador anterior: ADR 057 e issue #57.
    [NECESITA ACLARACIÓN] Grupo 12: qué `aud` e `iss` valida M6 en el token de servicio (ADR 009).
servers:
  - url: http://localhost:3006/api/v1
    description: Servidor de desarrollo local (Contenedor OCI)
security:
  - bearerAuth: []
tags:
  - name: Trips
    description: Operaciones del ciclo de vida y consultas de viajes
paths:
  /trips:
    get:
      tags:
        - Trips
      summary: Listar viajes filtrados (Para historial de M2 o consultas de Operador)
      description: |
        Permite a M2 obtener el historial resumido de un cliente (RF-2.4) o filtrar por conductor/estado.
        Devuelve `TripSummary` (sin coordenadas, RF-4.7 / RNF-19), paginado y ordenado por `createdAt` descendente.
        Roles permitidos:
        - `CLIENT` / `CLIENTE`: devuelve únicamente viajes de su propio `clientId`.
        - `DRIVER` / `CONDUCTOR`: devuelve únicamente viajes de su propio `driverId`.
        - `SYSTEM` / `SERVICIO` (ej. M2): **requiere obligatoriamente al menos un filtro** (`clientId`, `driverId` o `state`);
          una llamada sin filtros devuelve `400 Bad Request` (`code: "FILTER_REQUIRED"`) para evitar exponer viajes de todos los usuarios.
        - `OPERATOR` / `OPERADOR`: acceso administrativo de consulta.
      parameters:
        - in: query
          name: clientId
          schema:
            type: string
            format: uuid
          description: Filtrar por ID del cliente (obligatorio para consultas de historial desde M2 con rol SYSTEM/SERVICIO)
        - in: query
          name: driverId
          schema:
            type: string
            format: uuid
          description: Filtrar por ID del conductor
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/TripState"
          description: Filtrar por estado actual del viaje
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página (base 1)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad de elementos por página
      responses:
        "200":
          description: Página de viajes resumidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummaryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /trips/{id}:
    get:
      tags:
        - Trips
      summary: Consultar estado actual y resumen de un viaje (RF-6.2)
      description: |
        Accesible por el cliente del viaje (`CLIENT`), el conductor asignado (`DRIVER`), un operador (`OPERATOR`)
        o un módulo de servicio (`SYSTEM` / `roles: ["SERVICIO"]`, por ejemplo M2 al verificar que el viaje esté
        `COMPLETED`, pertenezca al `clientId` y obtener el `driverId` para calificar al conductor).
      parameters:
        - $ref: "#/components/parameters/TripIdParam"
      responses:
        "200":
          description: Detalle y estado actual del viaje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por M1 (Identidad y Acceso) con claim `sub` (o `identidad_id`) e información de rol.
        Soporta tanto `role` string (`CLIENT`, `DRIVER`, `OPERATOR`, `SYSTEM`) como `roles` array
        (`["CLIENTE"]`, `["CONDUCTOR"]`, `["OPERADOR"]`, `["SERVICIO"]`). El rol `SYSTEM` / `SERVICIO`
        corresponde a tokens de servicio usados en la comunicación entre módulos (ej. M2 → M6 o M5 → M6, RF-1.4).
  parameters:
    TripIdParam:
      name: id
      in: path
      required: true
      description: Identificador único del viaje (UUID)
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          example: INVALID_STATE_TRANSITION
        message:
          type: string
          example: No se puede pasar a IN_PROGRESS desde el estado PENDING_ARRIVAL
        correlationId:
          type: string
          description: ID de correlación para trazabilidad en logs (RNF-14)
        timestamp:
          type: string
          format: date-time
    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        originLatitude:
          type: number
          format: double
        originLongitude:
          type: number
          format: double
        destinationLatitude:
          type: number
          format: double
        destinationLongitude:
          type: number
          format: double
        state:
          $ref: "#/components/schemas/TripState"
        distanceKm:
          type:
            - number
            - "null"
          format: float
        durationMinutes:
          type:
            - integer
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripState:
      type: string
      enum:
        - PENDING_ARRIVAL
        - DRIVER_ARRIVED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED_BY_CLIENT
        - CANCELLED_BY_DRIVER
    TripSummary:
      type: object
      description: Vista resumida de un viaje para historiales (sin coordenadas, RF-2.4 / RF-4.7)
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/TripState"
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        distanceKm:
          type:
            - number
            - "null"
          format: float
        durationMinutes:
          type:
            - integer
            - "null"
        createdAt:
          type: string
          format: date-time
    TripSummaryPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripSummary"
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Cantidad total de viajes que cumplen el filtro
          example: 42
  responses:
    BadRequest:
      description: Datos de entrada inválidos o faltantes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: El rol o usuario autenticado no tiene permisos para realizar esta acción sobre el viaje
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Viaje no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Token JWT ausente, inválido o expirado (M1)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
