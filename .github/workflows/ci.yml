name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: spec-check del PR
        if: github.event_name == 'pull_request'
        env:
          RAMA: ${{ github.head_ref }}
          BASE: origin/${{ github.base_ref }}
        run: node scripts/spec-check.mjs --rama "$RAMA" --base "$BASE"
      - name: spec-check de main
        if: github.event_name == 'push'
        run: node scripts/spec-check.mjs

  contrato:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: ¿el contrato ya define operaciones?
        id: contrato
        run: |
          if grep -qE '^(paths|components|webhooks):' contrato/openapi.yml; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::contrato/openapi.yml todavía no define paths, components ni webhooks: se omite el lint hasta el contrato v1."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          fi
      - name: lint del contrato
        if: steps.contrato.outputs.listo == 'true'
        run: npx --yes @redocly/cli@2.62.1 lint contrato/openapi.yml

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: dependencias
        run: npm ci
      - name: build
        run: npm run build
      - name: lint
        run: npm run lint
      - name: tests
        run: npm test

  # Los nombres de los jobs no cambian: la regla «Protección de main» los exige como checks (RNF-17.2).
  contract-test:
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: dependencias
        run: npm ci
      - name: levantar servicio y base
        run: docker compose up -d --build --wait
      - name: salud
        run: curl -fsS http://localhost:8082/health
      - name: tests de contrato
        run: npm run contrato:test
      # docker compose stop espera 10 s y después mata el proceso (código 137): la parada ordenada tiene que llegar antes
      # (RNF-04.5).
      - name: parada en menos de 10 s con código 0
        run: |
          inicio=$(date +%s%N)
          docker compose stop m2
          ms=$(( ($(date +%s%N) - inicio) / 1000000 ))
          codigo=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q m2)")
          echo "Parada en $ms ms, código $codigo"
          if [ "$ms" -ge 10000 ] || [ "$codigo" -ne 0 ]; then
            echo "::error::La parada tardó $ms ms o terminó con código $codigo: tiene que ser en menos de 10 s y con 0."
            exit 1
          fi
      - name: logs si falla
        if: failure()
        run: docker compose logs

  auditoria-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: el cambio llegó por un PR aprobado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          APROBADORES: "sandobaitt agustinpagno"
        run: |
          # Recién mergeado, la API a veces falla o contesta vacío: cada consulta se reintenta antes de dar el rojo.
          consultar() {
            local intento salida estado
            for intento in 1 2 3 4 5; do
              estado=0
              salida=$(gh api "$1" --jq "$2") || estado=$?
              if [ "$estado" -eq 0 ] && [ -n "$salida" ]; then break; fi
              if [ "$intento" -lt 5 ]; then sleep 5; fi
            done
            printf '%s' "$salida"
            return "$estado"
          }
          pr=$(consultar "repos/$REPO/commits/$SHA/pulls" '.[0].number // empty') || { echo "::error::La API de GitHub no contestó al buscar el PR de $SHA"; exit 1; }
          if [ -z "$pr" ]; then echo "::error::Push directo a main sin PR ($SHA)"; exit 1; fi
          ok=$(consultar "repos/$REPO/pulls/$pr/reviews" '[.[] | select(.state == "APPROVED") | .user.login] | unique | join(" ")') || { echo "::error::La API de GitHub no contestó al buscar las aprobaciones del PR #$pr"; exit 1; }
          for u in $APROBADORES; do
            case " $ok " in *" $u "*) echo "PR #$pr aprobado por $u"; exit 0 ;; esac
          done
          echo "::error::PR #$pr mergeado sin aprobación de: $APROBADORES"
          exit 1
