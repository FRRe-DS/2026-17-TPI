<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estándar</title>
<style>
:root{--fondo:#FAF8F5;--sup:#FFFFFF;--tinta:#1F1A16;--acento:#8A5A2B;--borde:#E7E1D8;--suave:#6B625A;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--fondo);color:var(--tinta);font:15px/1.5 var(--sans);display:grid;grid-template-columns:240px 1fr;grid-template-rows:60px 1fr}
aside{grid-row:1/3;background:var(--sup);border-right:1px solid var(--borde);padding:20px 12px}
.marca{font-weight:700;padding:4px 12px 20px}
aside a{display:block;padding:10px 12px;border-radius:6px;color:var(--suave);text-decoration:none;font-size:14px}
aside a.on{background:#F3EDE5;color:var(--acento);font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--borde);background:var(--sup);font-size:14px}
.etq{font-size:12px;background:#F3EDE5;color:var(--acento);padding:3px 10px;border-radius:999px;margin-right:6px}
main{padding:32px}
h1{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.card{background:var(--sup);border:1px solid var(--borde);border-radius:10px;padding:20px}
.card small{color:var(--suave);font-size:13px}
.card b{display:block;font-size:24px;margin-top:4px}
.form{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-size:13px;color:var(--suave)}
input{display:block;width:100%;margin-top:6px;border:1px solid var(--borde);border-radius:8px;padding:10px 12px;font:15px var(--sans);min-height:44px}
.btn{grid-column:2;justify-self:end;background:var(--acento);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:600 14px var(--sans);min-height:44px}
</style></head><body>
<aside><div class="marca">M2 · Clientes</div><a class="on" href="#">Mi perfil</a><a href="#">Direcciones</a><a href="#">Preferencias</a><a href="#">Historial</a><a href="#">Calificaciones</a><a href="#">Estado de cuenta</a><a href="#">Detalle técnico</a><a href="#">M6 simulado</a></aside>
<header><div><span class="etq">simulado, pendiente de M1</span><span class="etq">simulado, pendiente de M6</span></div><div>CLIENTE · Ana Pérez · Cerrar sesión</div></header>
<main><h1>Mi perfil</h1>
<div class="grid"><div class="card"><small>Estado</small><b>Activo</b></div><div class="card"><small>Direcciones</small><b>3</b></div><div class="card"><small>Viajes</small><b>2</b></div>
<div class="card form"><div><label>Nombre</label><input value="Ana"></div><div><label>Apellido</label><input value="Pérez"></div><div><label>Teléfono</label><input value="+5493624000000"></div><div><label>Fecha de nacimiento</label><input value="1998-04-17"></div><button class="btn">Guardar</button></div></div>
</main></body></html>
