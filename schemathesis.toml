# Configuración de Schemathesis para `npm run contrato:test` (scripts/contrato-test.mjs). Todo lo que no está acá queda con los
# valores por defecto de Schemathesis. Por qué cada ajuste: specs/004-perfil-estado-cuenta/guia.md, entrada T10. Lo vigila
# pruebas/unitarias/contrato-test.test.ts.

# PostgreSQL no guarda el carácter nulo (U+0000) en un texto. El servicio lo rechaza con 400 (src/bd/pool.ts, con sus
# pruebas), pero el contrato lo admite, así que Schemathesis lo contaría como un rechazo de datos válidos.
[generation]
allow-x00 = false

# positive_data_acceptance: los valores por defecto de Schemathesis más el 422, solo en las operaciones que lo declaran en el
# contrato. Responden 422 ante una regla que el esquema no expresa: una Idempotency-Key reutilizada con otro cuerpo, y en
# crearBloqueo, además, un `hasta` que ya pasó o que no se puede devolver con un año de cuatro cifras.
[[operations]]
include-operation-id = "crearCliente"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", 401, 403, 404, 409, 422, 429, "5xx"]

[[operations]]
include-operation-id = "crearBloqueo"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", 401, 403, 404, 409, 422, 429, "5xx"]
