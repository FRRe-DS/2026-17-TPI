# Contrato de prueba con solo GET /health, como lo propone el borrador del contrato v1 (PR #16): la operación verificarSalud,
# pública. Sirve para probar que /health se registra desde el contrato cuando está en él (T20) y la rama «con implementadas»
# de scripts/contrato-test.mjs. El X-Request-Id no lleva patrón: el servicio no lo valida en la solicitud (RNF-14.3).
openapi: 3.1.0
info:
  title: M2 Clientes, contrato de prueba de la salud
  version: 0.0.0
  description: Solo GET /health.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /health:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
    get:
      operationId: verificarSalud
      summary: Verificar que el servicio responde.
      security: []
      responses:
        '200':
          description: El servicio responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: La base de datos no está disponible.
          content:
            application/problem+json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string

  schemas:
    Salud:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          const: ok
