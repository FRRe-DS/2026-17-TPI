# Compose >= 2.24.4. Reemplaza la herencia del panel por una lista permitida completa.
services:
  panel:
    profiles: !override [front]
    env_file: !reset []
    environment: !override
      PANEL_MODO_AUTH: oidc
      PANEL_ESCUCHA: 0.0.0.0
      PANEL_PUERTO: "${PANEL_PUERTO:-8083}"
      PANEL_URL_M2: http://m2:${M2_PUERTO:-8082}
      PANEL_URL_M2_PUBLICA: http://localhost:${M2_PUERTO:-8082}
      PANEL_ORIGEN_PUBLICO: http://localhost:${PANEL_PUERTO:-8083}
      PANEL_OIDC_EMISOR: http://localhost:${KEYCLOAK_PUERTO:-8080}/realms/ds-2026-realm
      PANEL_OIDC_URL_INTERNA: http://keycloak:8080/realms/ds-2026-realm
      PANEL_OIDC_CLIENTE: m2-front
      PANEL_TIEMPO_IDENTIDAD_MS: "2000"
      PANEL_M6_SIMULADO: "si"
  m6:
    profiles: !override [front]
    ports: !reset []
    environment:
      M6_CLIENTES_PRECARGA: c1e00000-0000-4000-8000-000000000001,c1e00000-0000-4000-8000-000000000002,d0b00000-0000-4000-8000-000000000001
